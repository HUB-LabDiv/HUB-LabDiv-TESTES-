<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUB LabDiv • Carregando</title>
    <meta name="theme-color" content="#121212">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #FFFFFF;
            font-family: 'Open Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 204, 0, 0.2);
            border-top-color: #FFCC00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .message {
            max-width: 400px;
            color: #94A3B8;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none; /* Inicialmente oculto */
        }
        .btn {
            margin-top: 1.5rem;
            background-color: #FFCC00;
            color: #0F4780;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="spinner" id="spinner"></div>
    <div class="message" id="errorMsg">
        <h2 style="color: #FFFFFF; margin-bottom: 1rem; font-size: 1.25rem;">Primeiro Acesso Offline</h2>
        <p>O HUB requer conexão com a internet no primeiro acesso para salvar a interface do app no seu dispositivo.</p>
        <button class="btn" onclick="retryConnection()">Tentar Novamente</button>
    </div>

    <script>
        const VERCEL_URL = 'https://hub-lab-div.vercel.app/';
        
        function retryConnection() {
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
            localStorage.removeItem('hub_offline_attempt'); // Reseta a trava
            attemptBoot();
        }

        function attemptBoot() {
            const lastAttempt = localStorage.getItem('hub_offline_attempt');
            const now = Date.now();
            
            // Trava de 5 segundos para evitar loop infinito caso o Service Worker não intercepte.
            if (lastAttempt && (now - parseInt(lastAttempt, 10)) < 5000) {
                showError();
            } else {
                localStorage.setItem('hub_offline_attempt', now.toString());
                
                // Dispara o redirecionamento para a URL remota.
                window.location.replace(VERCEL_URL);
            }
        }

        function showError() {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'block';
        }

        // Iniciar
        setTimeout(attemptBoot, 300); // Pequeno delay visual para UX
    </script>
</body>
</html>
