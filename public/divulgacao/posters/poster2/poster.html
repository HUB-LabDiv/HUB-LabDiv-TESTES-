<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUB LabDiv - A Universidade na Palma da Sua Mão (Poster 2)</title>
  <link rel="stylesheet" href="../../fonts/fonts.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @font-face {
      font-family: '29LT Bukra';
      src: local('29LT Bukra Semi Wide Bold'), local('29LT Bukra Bold'), local('29LTBukra-Bold'),
           url('../fonts/Outfit-Black.ttf') format('truetype');
      font-weight: 700 900;
      font-display: swap;
    }
    .font-bukra {
      font-family: '29LT Bukra', 'Outfit', sans-serif;
    }
    .font-open-sans {
      font-family: 'Open Sans', sans-serif;
    }

    body {
      background-color: #FFFFFF;
      color: #0F172A;
      width: 1240px;
      height: 1754px;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .poster-container {
      width: 1240px;
      height: 1754px;
      position: relative;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
      padding: 0;
      box-sizing: border-box;
    }

    /* LINHA DEGRADE COMPLETA (SEM METADE/METADE) */
    .brand-gradient-line-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #0F4780 0%, #0284C7 35%, #F14343 70%, #FFCC00 100%);
      z-index: 50;
    }
    .brand-gradient-line-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #0F4780 0%, #0284C7 35%, #F14343 70%, #FFCC00 100%);
      z-index: 50;
    }

    /* 1. SEÇÃO DO HEADER */
    .header-section {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      padding-top: 40px;
      padding-left: 48px;
      padding-right: 48px;
    }

    /* Logo HUB LabDiv ampliada substancialmente */
    .top-logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 34px;
    }
    .logo-icon {
      height: 98px;
      width: 98px;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(15, 71, 128, 0.16));
    }
    .logo-brand {
      font-size: 76px;
      font-weight: 900;
      letter-spacing: -1.2px;
      line-height: 1;
    }
    .logo-brand .hub-name {
      color: #0F172A;
    }
    .logo-brand .labdiv-name {
      background: linear-gradient(90deg, #0F4780 0%, #F14343 50%, #D97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Título movido mais para baixo */
    h1.central-title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.12;
      color: #0F172A;
      letter-spacing: -1px;
      text-align: center;
      margin-bottom: 24px;
    }

    .palma-text {
      color: #D97706; /* Âmbar nítido de alto contraste */
      font-weight: 900;
      display: inline-block;
      text-shadow: 0 2px 10px rgba(217, 119, 6, 0.22);
    }

    /* 2. OS TRÊS EIXOS (ABAIXO DO TÍTULO SEM TEXTO INTERMEDIÁRIO) */
    .axes-section {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 24px;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto 10px auto;
      padding-left: 48px;
      padding-right: 48px;
    }
    .axis-card {
      flex: 1;
      height: 136px;
      background: #FFFFFF;
      border-radius: 18px;
      box-shadow: 0 8px 24px -2px rgba(15, 71, 128, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }
    .axis-card-social {
      border: 2px solid rgba(15, 71, 128, 0.20);
      border-top: 4.5px solid #0F4780;
    }
    .axis-card-info {
      border: 2px solid rgba(241, 67, 67, 0.22);
      border-top: 4.5px solid #F14343;
    }
    .axis-card-tools {
      border: 2px solid rgba(255, 204, 0, 0.38);
      border-top: 4.5px solid #FFCC00;
    }

    .axis-badge {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .badge-social {
      background: #EEF4FA;
      color: #0F4780;
      border: 1.5px solid rgba(15, 71, 128, 0.22);
    }
    .badge-info {
      background: #FEF2F2;
      color: #F14343;
      border: 1.5px solid rgba(241, 67, 67, 0.22);
    }
    .badge-tools {
      background: #FEF9C3;
      color: #854D0E;
      border: 1.5px solid rgba(255, 204, 0, 0.40);
    }

    .axis-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .axis-title {
      font-size: 23px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 4px;
    }
    .title-social { color: #0F4780; }
    .title-info { color: #F14343; }
    .title-tools { color: #854D0E; }

    .axis-desc {
      font-size: 15px;
      font-weight: 600;
      color: #475569;
      line-height: 1.25;
    }

    /* 3. ILUSTRAÇÃO DA MÃO VINDO DE FORA DA PÁGINA COM CELULAR EXPANDIDO */
    .illustration-wrap {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 1240px;
      height: 1220px;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }

    .illustration-wrap svg.hand-phone-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UI DA TELA DO SMARTPHONE EXPANDIDA */
    .phone-screen-ui {
      background: #FFFFFF;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 22px 20px 22px;
      box-sizing: border-box;
      border-radius: 20px;
      font-family: 'Open Sans', sans-serif;
    }

    .screen-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
    }
    .screen-logo-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .screen-logo-text {
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }
    .screen-logo-text .hub-part { color: #0F172A; }
    .screen-logo-text .labdiv-part {
      background: linear-gradient(90deg, #0F4780 0%, #F14343 50%, #D97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .screen-qr-holder {
      width: 270px;
      height: 270px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      padding: 6px;
      box-sizing: border-box;
    }
    .screen-qr-holder svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .screen-qr-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .screen-qr-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.28));
    }

    .screen-cta-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
      margin-bottom: 4px;
    }
    .screen-cta-title {
      font-size: 20px;
      font-weight: 900;
      color: #0F172A;
      letter-spacing: 0.3px;
    }
    .screen-cta-url {
      font-size: 16px;
      font-weight: 800;
      color: #0B57D0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .screen-cta-pill {
      margin-top: 8px;
      background: #0B57D0;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      padding: 7px 20px;
      border-radius: 9999px;
      box-shadow: 0 4px 12px rgba(11, 87, 208, 0.30);
      letter-spacing: 0.2px;
    }

    /* FOOTER DISCRETO NO CANTO INFERIOR ESQUERDO */
    .footer-stamp {
      position: absolute;
      bottom: 16px;
      left: 48px;
      z-index: 40;
      font-size: 14px;
      font-weight: 700;
      color: #64748B;
    }
  </style>
</head>
